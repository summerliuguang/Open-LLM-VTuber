# Open-LLM-VTuber 局域网反代
# 按实际情况修改:对外端口、server_name(本机内网 IP)、证书名
# 注意:LLM/语音走 WebSocket,Upgrade 头与 proxy_buffering off 不能省

map $http_upgrade $ollvt_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 29011 ssl;
    server_name _;

    # SSO 统一登录保护(域账号,登录一次全端口通行;见 sso-domain-login 技能)
    include /etc/nginx/snippets/sso-auth.conf;

    # 明文 http 打到 ssl 端口时自动 301 到 https(导航页链接是 http://)
    error_page 497 =301 https://$host:$server_port$request_uri;

    ssl_certificate /etc/nginx/ssl/ollvt.crt;
    ssl_certificate_key /etc/nginx/ssl/ollvt.key;

    client_max_body_size 20M;

    location / {
        # 前端更新即时生效:入口与页面资源不缓存(资产为哈希文件名,重复请求代价小)
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:12393;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 升级(对话/音频流)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ollvt_connection_upgrade;
        # 流式响应不缓冲
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
    }
}
